[project]
name = "fund2-api"
version = "0.1.0"
description = "Fund Core API - FastAPI + Postgres (PRD Lumine Fund v2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "bcrypt>=4.2",
    "pydantic>=2.8",
    "pandas>=2.2",
    "pyarrow>=18",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
