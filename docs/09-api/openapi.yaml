  /api/v1/portfolio/{portfolio_id}/equity:
    get:
      tags:
      - portfolio
      summary: Get Equity Curve
      description: 'Equity curve (B-05/B-06) — derived dari live positions (opened_at
        +

        mark-to-market kumulatif). Fallback deterministik saat DB tidak tersedia

        atau belum ada posisi (bukan demo — lihat _real_equity_series).


        NOTE: total dihitung sebelum _real_equity_series agar pagination valid.'
      operationId: get_equity_curve_api_v1_portfolio__portfolio_id__equity_get
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: string
          title: Portfolio Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Lumine-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Api-Key
      - name: X-Lumine-Timestamp
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Timestamp
      - name: X-Lumine-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Signature
      responses:
