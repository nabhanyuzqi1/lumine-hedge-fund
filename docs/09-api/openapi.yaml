      tags:
      - portfolio
      summary: Delete Portfolio
      description: Delete a portfolio — v1 refuses the only book (safe default).
      operationId: delete_portfolio_api_v1_portfolio__portfolio_id__delete
      parameters:
      - name: portfolio_id
        in: path
        required: true
        schema:
          type: string
          title: Portfolio Id
      - name: X-Lumine-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Api-Key
      - name: X-Lumine-Timestamp
        in: header
        required: false
        schema:
