components:
  schemas:
    AdminKey:
      properties:
        key_id:
          type: string
          title: Key Id
        name:
          type: string
          title: Name
          default: ''
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        revoked:
          type: boolean
          title: Revoked
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - key_id
      - scopes
      - revoked
      - created_at
      title: AdminKey
      description: API key management view.
    CreateKeyRequest:
      properties:
        key_id:
          type: string
          pattern: ^[a-z0-9_-]{4,32}$
          title: Key Id
        name:
          type: string
          title: Name
          default: ''
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        revoked:
          type: boolean
          title: Revoked
          default: false
      type: object
      required:
      - key_id
      - scopes
      title: CreateKeyRequest
      description: Payload to create a new API key.
    CreateOrderRequest:
      properties:
        portfolio_id:
          type: string
          title: Portfolio Id
        symbol:
          type: string
          title: Symbol
          default: XAUUSD
        side:
          type: string
          enum:
          - buy
          - sell
          title: Side
        order_type:
          type: string
          enum:
          - market
          - limit
          - stop
          title: Order Type
          default: market
        volume:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Volume
        price:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Price
        stop_loss:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Stop Loss
        take_profit:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Take Profit
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
      type: object
      required:
      - portfolio_id
      - side
      - volume
      title: CreateOrderRequest
      description: Payload to submit a new order.
    CreatedAdminKey:
      properties:
        key_id:
          type: string
          title: Key Id
        secret:
          type: string
          title: Secret
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - key_id
      - secret
      - scopes
      - created_at
      title: CreatedAdminKey
      description: API key creation response containing the secret exactly once.
    ExposureSummary:
      properties:
        symbol:
          type: string
          title: Symbol
        notional:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Notional
        pct_of_nav:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Pct Of Nav
        correlated_bucket:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlated Bucket
      type: object
      required:
      - symbol
      - notional
      - pct_of_nav
      title: ExposureSummary
      description: Exposure breakdown per symbol/bucket.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JournalEntry:
      properties:
        entry_id:
          type: string
          format: uuid
          title: Entry Id
        trade_id:
          type: string
          format: uuid
          title: Trade Id
        agent_name:
          type: string
          title: Agent Name
        reflection:
          type: string
          title: Reflection
        lesson:
          type: string
          title: Lesson
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - entry_id
      - trade_id
      - agent_name
      - reflection
      - lesson
      - created_at
      title: JournalEntry
      description: Trade journal entry.
    KillSwitchRequest:
      properties:
        reason:
          type: string
          title: Reason
        armed:
          type: boolean
          title: Armed
          default: true
      type: object
      required:
      - reason
      title: KillSwitchRequest
      description: Payload to arm/disarm the kill switch.
    KillSwitchStatus:
      properties:
        armed:
          type: boolean
          title: Armed
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - armed
      title: KillSwitchStatus
      description: Current kill-switch state.
    LineageRecord:
      properties:
        lineage_id:
          type: string
          format: uuid
          title: Lineage Id
        decision_id:
          type: string
          title: Decision Id
        decision_type:
          type: string
          title: Decision Type
        agent_name:
          type: string
          title: Agent Name
        inputs_hash:
          type: string
          title: Inputs Hash
        outputs_hash:
          type: string
          title: Outputs Hash
        policy_version:
          type: string
          title: Policy Version
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - lineage_id
      - decision_id
      - decision_type
      - agent_name
      - inputs_hash
      - outputs_hash
      - policy_version
      - created_at
      title: LineageRecord
      description: Decision lineage audit record.
    MarketBar:
      properties:
        symbol:
          type: string
          title: Symbol
        timeframe:
          type: string
          title: Timeframe
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        open:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Open
        high:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: High
        low:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Low
        close:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Close
        volume:
          type: integer
          title: Volume
      type: object
      required:
      - symbol
      - timeframe
      - timestamp
      - open
      - high
      - low
