openapi: 3.1.0
info:
  title: Lumine API
  description: Institutional AI-native quantitative hedge fund API
  version: 0.1.0
paths:
  /api/v1/portfolio/summary:
    get:
      tags:
      - portfolio
      summary: Get Summary
      description: Return the single (default) portfolio summary (live DB + MTM).
      operationId: get_summary_api_v1_portfolio_summary_get
      parameters:
      - name: X-Lumine-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Api-Key
      - name: X-Lumine-Timestamp
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Timestamp
      - name: X-Lumine-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Lumine-Signature
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/portfolio:
    get:
      tags:
      - portfolio
      summary: Get Portfolio
      description: Return the single (default) portfolio (B-06 portfolio CRUD).
