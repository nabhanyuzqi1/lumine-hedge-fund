# SUPERSEDED (2026-08-09) — host nginx TIDAK lagi dipakai (systemctl
# disable). Landing page kini disajikan container `control-landing`
# (nginx:alpine, bridge 127.0.0.1:8080:80, ro-mount /var/www/lumine) dari
# compose control-plane di VPS (/srv/control-plane/landing/nginx.conf).
# File ini dipertahankan sebagai dokumentasi konfigurasi host lama —
# jangan di-deploy. Isi di bawah setara dengan konfigurasi container.
server {
    # Loopback-only: landing page HANYA lewat Caddy (control plane).
    # Jangan ubah ke 0.0.0.0 — itu membuka port publik kedua di luar Caddy.
    listen 127.0.0.1:8080;
    server_name _;

    # ── Landing page (public via / dan alias /site*) ──
    root /var/www/lumine;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
