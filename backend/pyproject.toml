[project]
name = "lumine"
version = "0.1.0"
description = "AI-Native Quantitative Hedge Fund Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Lumine Engineering" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "pyautogen>=0.3.3",
    "python-json-logger>=3.2.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "orjson>=3.10.0",
    "docker>=7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "types-jsonschema>=4.23.0",
    "testcontainers[postgres,redis]>=4.0.0",
    "fakeredis>=2.37.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "dist",
    "build",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "TRY003", # external-raise
    "PLR2004", # magic-value-comparison
    "D100",   # missing-module-docstring
    "D103",   # missing-function-docstring
    "D104",   # missing-package-docstring
    "COM812", # missing-trailing-comma — conflicts with formatter
    "ISC001", # single-line-implicit-string-concatenation — conflicts with formatter
    # ── Legacy debt (2026-08-14): kategori ini sengaja di-defer — bukan gate.
    #   Debt annotation/docstring/style tersebar di codebase lama (851→~60
    #   setelah --fix + ignore ini); rules correctness/security (F,B,S,E4/E7/
    #   E9,I,UP) tetap aktif. Bersihkan bertahap di sprint terpisah.
    "ANN",    # annotation debt — 155 kasus legacy
    "D101",   # missing-docstring-in-public-class
    "D102",   # missing-docstring-in-public-method
    "D107",   # undocumented-public-init
    "E501",   # line-too-long — formatter concern, bukan lint gate
    "PLC0415", # import-outside-top-level — lazy imports pola deliberate (heavy deps)
    "DTZ005", # call-datetime-now-without-tzinfo — legacy; audit terpisah
    "SLF001", # private-member-access — deliberate (singletons/tests)
    "G004",   # logging-f-string — legacy; konversi bertahap
    "T201",   # print — scripts/tools
    "ARG",    # unused-function-arguments — legacy
    "BLE001", # blind-except — legacy; kode baru wajib noqa + konteks
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "SIM105", # suppressible-exception — prefer contextlib, legacy
    "TC001",  # typing-only-first-party-import
    "EM102",  # f-string-in-exception
    "TRY400", # error-instead-of-exception — legacy; konversi bertahap
    "PTH123", # builtin-open — legacy
    "RET504", # unnecessary-assign — legacy
    "S110",   # try-except-pass — legacy
    "D401",   # non-imperative-mood — legacy
    "DTZ003", # call-datetime-utcnow — legacy; audit terpisah
    "EM101",  # raw-string-in-exception — legacy
    "TC002",  # typing-only-third-party-import
    "TC003",  # typing-only-standard-library-import
    "D205",   # missing-blank-line-after-summary — legacy
    "ERA001", # commented-out-code — legacy (komentar dokumentasi kalkulasi)
    "INP001", # implicit-namespace-package — legacy layout
    "B008",   # function-call-in-default-argument — legacy (Body() di rpc.py)
    "CPY001", # missing-copyright-notice — legacy
    "D105",   # undocumented-magic-method
    "D400",   # missing-trailing-period — legacy
    "D415",   # missing-terminal-punctuation — legacy
    "FAST002", # fast-api-non-annotated-dependency — legacy (rpc.py Body())
    "FBT001", # boolean-type-hint-positional-argument — legacy
    "FBT002", # boolean-default-value-positional-argument — legacy
    "PERF401", # manual-list-comprehension — legacy
    "PTH118", # os-path-join — legacy
    "PTH120", # os-path-dirname — legacy
    "RUF022", # unsorted-dunder-all — legacy
    "SIM102", # collapsible-if — legacy
    "TRY300", # try-consider-else — legacy
    "PLW1508", # invalid-envvar-default — legacy (os.getenv bool)
]

[tool.ruff.lint.per-file-ignores]
"src/lumine/autogen_pipeline/**/*" = [
    "ANN001", # missing-type-function-argument
    "ANN201", # missing-return-type
]
"src/lumine/data/models.py" = [
    "D101",   # missing-docstring — ORM models, self-documenting
    "E501",   # line-too-long — ORM column defs
    "RUF012", # mutable-class-default — SQLAlchemy type_annotation_map
]
"src/lumine/data/redis_client.py" = [
    "PLW0603", # global-statement — singleton pattern
    "ASYNC109", # async-timeout-param — matches BRPOP signature
    "E501",    # line-too-long — Redis helper signatures
]
"src/lumine/trading/mt5_bridge.py" = [
    "ASYNC109", # async-timeout-param — matches bridge method signature
]
"src/lumine/data/session.py" = [
    "PLW0603", # global-statement — singleton pattern
    "PLW0602", # global-no-assignment — dispose_engine resets
]
"src/lumine/shared/config.py" = [
    "S104",    # possible-bind-all-interfaces — Docker/API intentional
    "PLW0603", # global-statement — singleton pattern
]
"src/lumine/api/schemas/**/*" = [
    "TC003",   # stdlib imports stay runtime — Pydantic resolves annotations at model build
]
"tests/**/*" = [
    "S101",   # assert — idiomatic in pytest
    "S105",   # hardcoded-password — test fixtures use dummy secrets
    "D102",   # missing-docstring-in-public-method — test methods self-documenting
    "D101",   # missing-docstring-in-public-class — test classes self-documenting
    "S106",   # hardcoded-password — test fixtures use dummy secrets
    "S104",   # hardcoded-bind-all-interfaces — asserts default config value
    "EM101",  # raw-string-in-exception — test raises use string literals intentionally
    "PLC0415", # import-outside-top-level — lazy imports in fixtures avoid heavy deps at collection
    "ASYNC109", # async-timeout-param — fake Redis methods mirror redis-py signatures
    "PLR0913", # too-many-arguments — test helpers intentionally mirror bar fields
    "PLR0917", # too-many-positional-arguments — test helpers intentionally mirror bar fields
    "ERA001", # commented-out-code — indicator comments document hand calculations
    "ARG001", # unused-argument — httpx.MockTransport/run_chain callbacks require signature params
    "PT019",  # pytest-fixture-param-without-value — seed fixtures return values tests consume
    "F811",   # redefined-while-unused — FakeRedis method names mirror redis-py
    "TRY002", # create-your-own-exception — test raises use builtins intentionally
    "FURB162", # fromisoformat-replace-z — test fixtures use fixed offsets
    "F841",   # unused-variable — test helpers assign for readability
    "EXE001", # shebang-without-exec-bit — Windows checkout tidak set exec mode
]
"alembic/env.py" = [
    "INP001", # implicit-namespace-package — alembic script location, not a package
    "CPY001", # missing-copyright-notice — autogenerated by alembic
    "ANN001", # missing-type-function-argument — autogenerated
    "ANN201", # missing-return-type-undocumented-public-function — autogenerated
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["src/lumine/autogen_pipeline/"]

[[tool.mypy.overrides]]
module = [
    "structlog.*",
    "pyautogen.*",
    "redis.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--asyncio-mode=auto",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests — no I/O, no database, no network",
    "integration: Integration tests — real database, real Redis",
    "contract: Contract tests — API shape validation",
    "system: System tests — full cycle with mocked external services",
    "slow: Tests that take > 5 seconds",
]

[tool.coverage.run]
source = ["src/lumine"]
omit = [
    "*/tests/*",
    "*/alembic/*",
]

[tool.coverage.report]
# CI gate: pytest --cov --cov-fail-under=65 temporarily while adding trade_core tests.
# Current coverage is 68%, target is 80%. Raising this in same PR as test improvements.
fail_under = 65
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "pragma: no cover",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
