services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lumine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback-only: entry publik lewat Caddy (control plane, D11-7).
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lumine:${DB_PASSWORD}@postgres:5432/lumine
      # Production mode: DB-backed orders/positions + MT5 bridge aktif
      # (default demo_data=True — WAJIB 0 di production)
      - DEMO_DATA=${DEMO_DATA:-0}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY}
      - LLM_GATEWAY_API_KEY=${LLM_GATEWAY_API_KEY}
      # 9router gateway (Phase 6 D6-2). In-container DNS resolves `9router` to
      # the 9router service below. Override per-host via .env if needed.
      - LLM_GATEWAY_URL=http://9router:20128
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── MT5 via Wine + XFCE4 + x11vnc + noVNC ───────────────────────────────────
  # Image dibangun dari scripts/deploy/mt5/{Dockerfile,entrypoint.sh}.
  # Wine prefix + MT5 install persist di volume mt5_wine (rebuild aman).
  # Akses:
  #   - Browser (noVNC): http://<VPS_HOST>:6901/vnc.html   (password VNC_PASSWORD)
  #   - VNC client     : <VPS_HOST>:5900
  # Catatan: deviasi dari Phase 8 (MT5 di Windows VPS terpisah). Lihat
  # scripts/deploy/VPS-GUIDE.md Bagian 0 untuk justifikasi Wine-in-Docker.
  mt5:
    build:
      context: ../scripts/deploy/mt5
      dockerfile: Dockerfile
    container_name: lumine-mt5
    ports:
      # Loopback-only: akses VNC/noVNC lewat Caddy + Authelia (D11-7).
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6901:6901"
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:?VNC_PASSWORD wajib di .env}
      - RESOLUTION=1280x768x24
    volumes:
      - mt5_data:/root/.wine-mt5
      # ── EA source bind-mount (v4+) ─────────────────────────────────────
      # PITFALL (17 Aug 2026): /opt/lumine-ea di-bake DI DALAM image → docker
      # cp ke host TIDAK berpengaruh, entrypoint selalu copy versi image lama
      # (EA jalan seed=OFF padahal source sudah di-update). Bind mount ini
      # membuat /opt/lumine-ea = folder host → update EA cukup scp ke host,
      # restart container, entrypoint copy versi baru + MT5 recompile on boot.
      - /opt/lumine-ea:/opt/lumine-ea:ro
    restart: unless-stopped
    # Healthcheck: cek Xvfb + x11vnc + terminal64.exe hidup.
    # Docker restart policy tidak trigger on unhealthy — tapi watchdog di
    # entrypoint.sh meng-exit container saat proses kritis mati, sehingga
    # restart: unless-stopped efektif. Healthcheck ini untuk observabilitas
    # (docker ps menampilkan status) dan dependensi API.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -x Xvfb >/dev/null 2>&1 &&
          pgrep -x x11vnc >/dev/null 2>&1 &&
          pgrep -f 'terminal64\.exe' >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── MT5 crypto instance (22 Aug 2026): Exness, BTCUSD streaming 24/7 ───────
  # Stream harga crypto saat forex libur → MarketService/BTCUSD otomatis
  # terisi (tick shared queue), status/logs terpisah via X-Instance header.
  # Setup manual pertama: VNC → buka chart BTCUSD, attach EA LumineEA,
  # InpProxyURL=http://lumine.biz.id/mt5-proxy-crypto, InpSeedSymbols=BTCUSD,
  # save profile → backup ke ${WINEPREFIX}/lumine-workspace-crypto-backup.
  mt5-crypto:
    build:
      context: ../scripts/deploy/mt5-crypto
      dockerfile: Dockerfile
    container_name: lumine-mt5-crypto
    ports:
      - "127.0.0.1:5902:5900"
      - "127.0.0.1:6903:6901"
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:?VNC_PASSWORD wajib di .env}
      - RESOLUTION=1280x768x24
    volumes:
      - mt5_crypto_data:/root/.wine-mt5-crypto
      - /opt/lumine-ea:/opt/lumine-ea:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -x Xvfb >/dev/null 2>&1 &&
          pgrep -x x11vnc >/dev/null 2>&1 &&
          pgrep -f 'terminal64\.exe' >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

  # ── 9router LLM gateway (Phase 6 D6-2, Phase 11 deployment) ────────────────
  # Single egress for all LLM traffic. Dashboard on :20128, OpenAI-compatible
  # API on :20128/v1. State (provider keys, OAuth, fallback config) persists
  # in named volume `9router_data` -> /app/data inside container.
  # Move VPS: `docker volume export` / re-pull image on new host.
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always

  9router:
    image: decolua/9router:latest
    container_name: 9router
    ports:
      # TETAP publik: agent eksternal (termasuk agent AI) hit 9router langsung.
      # JANGAN ubah ke 127.0.0.1 — semua agent luar akan down (D11-7).
      - "20128:20128"
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - HEADROOM_URL=http://headroom:8787
    volumes:
      - 9router_data:/app/data
    depends_on:
      - headroom
    restart: always

volumes:
  postgres_data:
  redis_data:
  9router_data:
  mt5_data:
  # 22 Aug 2026: volume instance crypto (Exness/BTCUSD) — terpisah dari HFM.
  mt5_crypto_data: