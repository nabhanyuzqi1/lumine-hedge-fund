---
# Authelia 4.38 configuration untuk Lumine Superadmin Control Center
# Referensi: https://www.authelia.com/configuration/

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

theme: dark

# identity_validation replaces jwt_secret di 4.38
identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_JWT_SECRET}

default_redirection_url: http://166.88.227.177/superadmin

totp:
  issuer: lumine-hedge-fund
  disable: false

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      salt_length: 16
      parallelism: 4
      memory: 65536

access_control:
  default_policy: deny
  rules:
    # Superadmin: semua route /superadmin/* dan embed routes
    - domain: "166.88.227.177"
      resources:
        - "^/superadmin"
        - "^/superadmin/.*$"
        - "^/novnc"
        - "^/novnc/.*$"
        - "^/9router"
        - "^/9router/.*$"
        - "^/dozzle"
        - "^/dozzle/.*$"
      policy: one_factor

    # Public bypass (tidak perlu auth)
    - domain: "166.88.227.177"
      resources:
        - "^/$"
        - "^/terminal"
        - "^/terminal/.*$"
        - "^/dashboard"
        - "^/dashboard/.*$"
        - "^/health$"
        - "^/api/v1/.*$"
        - "^/auth"
        - "^/auth/.*$"
      policy: bypass

session:
  secret: ${AUTHELIA_SESSION_SECRET}
  name: lumine_session
  expiration: 3600    # 1 jam
  inactivity: 300     # 5 menit

  cookies:
    - domain: "166.88.227.177"
      authelia_url: http://166.88.227.177/auth/
      default_redirection_url: http://166.88.227.177/superadmin

  redis:
    host: redis
    port: 6379
    database_index: 1

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
