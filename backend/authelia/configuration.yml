---
# Authelia 4.38 configuration untuk Lumine Superadmin Control Center
# Mode: HTTP-only (bare IP, belum domain+HTTPS)
# Setelah domain lumine.biz.id aktif di Cloudflare:
#   - Hapus insecure_skip_verify
#   - Ganti http:// → https://lumine.biz.id
#   - Set ssl_mode di session.redis jika perlu

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

theme: dark

identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_JWT_SECRET}

# Redirect setelah login berhasil
default_redirection_url: http://166.88.227.177/superadmin

totp:
  issuer: lumine-hedge-fund
  disable: false

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      salt_length: 16
      parallelism: 4
      memory: 65536

access_control:
  default_policy: deny
  rules:
    # Superadmin routes (dilindungi)
    - domain: "166.88.227.177"
      resources:
        - "^/superadmin(/.*)?$"
        - "^/novnc(/.*)?$"
        - "^/dozzle(/.*)?$"
        - "^/9router(/.*)?$"
      policy: one_factor

    # Semua lain = bypass (public)
    - domain: "166.88.227.177"
      policy: bypass

session:
  secret: ${AUTHELIA_SESSION_SECRET}
  name: lumine_session
  expiration: 3600
  inactivity: 300

  cookies:
    - domain: "166.88.227.177"
      authelia_url: http://166.88.227.177/auth/
      # insecure_skip_verify diperlukan karena belum HTTPS
      # Hapus setelah domain + HTTPS aktif
      insecure_skip_verify: true

  redis:
    host: redis
    port: 6379
    database_index: 1

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
