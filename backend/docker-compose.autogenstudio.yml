# AutoGen Studio - Visual Agent Management UI
# Runs alongside Lumine backend stack

services:
  autogenstudio:
    image: python:3.12-slim
    container_name: lumine-autogenstudio
    working_dir: /app
    environment:
      # 9router (LLM gateway) sebagai backend OpenAI-compatible untuk
      # AutoGen Studio — hubungkan pipeline (17 Aug 2026): key dari .env
      # LLM_GATEWAY_API_KEY; base URL menunjuk 9router di network backend.
      - OPENAI_API_KEY=${LLM_GATEWAY_API_KEY:-${NINEROUTER_API_KEY:-}}
      - OPENAI_BASE_URL=http://9router:20128/v1
      - AUTOGENSTUDIO_DATABASE_URL=postgresql://lumine:${DB_PASSWORD:-lumine}@postgres:5432/lumine
      - AUTOGENSTUDIO_APP_DIR=/app/data
      - PORT=8081
    volumes:
      - autogenstudio_data:/app/data
    command: >
      bash -c "
        pip install --no-cache-dir autogenstudio &&
        autogenstudio ui --host 0.0.0.0 --port 8081 --appdir /app/data
      "
    ports:
      - "8081:8081"
    networks:
      - autogenstudio_net
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim tidak punya curl — pakai urllib agar healthcheck
      # valid (sebelumnya selalu unhealthy → superadmin stack health merah).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.lumine.service=autogenstudio"
      - "com.lumine.description=AutoGen Studio Visual Agent Management"

volumes:
  autogenstudio_data:
    name: lumine_autogenstudio_data

networks:
  autogenstudio_net:
    driver: bridge
