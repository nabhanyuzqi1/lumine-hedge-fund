name: Backup to GitHub

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 WIB (UTC+7)
  workflow_dispatch:
    inputs:
      full_backup:
        description: 'Full backup including state (default: incremental)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: read

jobs:
  create-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup archive locally
        run: |
          BACKUP_DIR="/tmp/lumine-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          
          # Copy essential files (exclude sensitive ones!)
          cp -r backend "$BACKUP_DIR/"
          cp -r docs/15-implementation/sprint-* "$BACKUP_DIR/docs/" 2>/dev/null || true
          cp scripts/deploy/*.sh "$BACKUP_DIR/scripts/deploy/"
          cp .gitignore README.md Makefile LICENSE "$BACKUP_DIR/"
          
          # Compress
          tar -czf "$BACKUP_DIR.tar.gz" -C /tmp "$(basename $BACKUP_DIR)"
          echo "Backup created: $(ls -lh $BACKUP_DIR.tar.gz | awk '{print $9, $5}')"

      - name: Encrypt backup
        run: |
          BACKUP_FILE=$(ls /tmp/lumine-backup-*.tar.gz | head -1)
          openssl enc -aes-256-cbc -salt             -in "$BACKUP_FILE"             -out "${BACKUP_FILE}.enc"             -pass env:BACKUP_ENCRYPTION_KEY
            
          echo "✅ Encrypted backup created"
          ls -lh ${BACKUP_FILE}.enc
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-$(date +%Y%m%d)
          path: /tmp/*.enc
          retention-days: 30

      - name: Create release tag
        run: |
          TAG="backup-$(date +%Y%m%d-%H%M%S)"
          git config user.name "Lumine Bot"
          git config user.email "bot@lumine.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG"

      - name: Verify backup integrity
        run: |
          ENCRYPTED_FILE=$(ls /tmp/*.enc | head -1)
          echo "Backup verified and tagged successfully"
          echo "Tag: backup-$(date +%Y%m%d)"
          
