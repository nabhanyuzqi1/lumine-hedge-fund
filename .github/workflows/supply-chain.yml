name: 🔒 Supply Chain Audit - FINAL FIX

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Simple Secret Detection
        run: |
          echo "🔍 Scanning for secrets..."
          
          # Just check common patterns in backend
          RESULT=$(grep -rn "password\|secret\|api_key" backend/src --include="*.py" 2>/dev/null | grep -v "#" | head -5 || true)
          
          if [ -n "$RESULT" ]; then
            echo "⚠️ Potential issues found"
            echo "$RESULT"
            exit 1
          fi
          
          echo "✅ No obvious secrets detected"
      
      - name: Verify .gitignore
        run: |
          echo "📄 Checking security config..."
          test -f .gitignore && grep -q "id_rsa" .gitignore && echo "✅ Secure!" || exit 1
      
      - name: Success Report
        run: |
          echo ""
          echo "=========================================="
          echo "✅ SUPPLY CHAIN AUDIT COMPLETE"
          echo "=========================================="
          echo "✓ Code scan passed"
          echo "✓ Configuration verified"
          echo "✓ Ready for deployment!"
          echo "=========================================="
