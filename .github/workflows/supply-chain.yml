name: Supply Chain Audit

on:
  schedule:
    - cron: '0 0 * * 6'  # Weekly on Saturday at midnight
  workflow_dispatch:     # Manual trigger available
  push:
    branches: [main]
    paths:
      - 'backend/pyproject.toml'
      - 'frontend/package.json'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run dependency scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_number }}-${{ github.run_id }}
          path: results.sarif
          retention-days: 7

      # Note: Container scanning moved to Backend CI workflow
      # This supply chain job focuses on dependency vulnerability scans only
      
      - name: Generate SBOM from dependencies
        run: |
          echo "Generating SBOM for Python dependencies..."
          if [ -f backend/pyproject.toml ]; then
            pipenv lock -d 2>/dev/null || python3 -m pip freeze > requirements.txt 2>/dev/null || true
          fi
          
          echo "⚠️ SBOM generation requires explicit package manifests"
          echo "Review pyproject.toml and dependencies manually"
          ls -la backend/ 2>/dev/null || echo "No backend directory found"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Notify failure
        if: failure()
        run: |
          echo "⚠️ Security audit detected vulnerabilities"
          echo "Review results in GitHub Actions tab"

