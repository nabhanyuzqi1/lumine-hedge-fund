name: Supply Chain Audit - SECURE & RELIABLE v2.0

on:
  schedule:
    - cron: '0 0 * * 6'  # Weekly on Saturday at midnight WIB
  workflow_dispatch:     # Manual trigger available

# Explicit permissions for workflow security
permissions:
  contents: read

# Cache settings to prevent stale runs
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-dependencies:
    name: "Python Dependency Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install pip-audit (simple dependency scanner)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      
      - name: Run pip-audit scan
        run: |
          cd backend
          echo "Scanning Python dependencies..."
          pip-audit --format json > /tmp/pip-audit-results.json || true
          
          # Show summary
          if [ -f /tmp/pip-audit-results.json ]; then
            VULN_COUNT=$(python3 -c "import json; data=json.load(open('/tmp/pip-audit-results.json')); print(len([v for v in data if v.get('vuln_id')]))")
            echo "Found $VULN_COUNT vulnerabilities"
            cat /tmp/pip-audit-results.json | head -50
          else
            echo "No vulnerabilities found or scanning not applicable"
          fi
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report-${{ github.run_number }}
          path: /tmp/pip-audit-results.json
          retention-days: 7

  check-secrets:
    name: "Secret Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run simple secret check
        run: |
          echo "Checking for secrets in codebase..."
          
          # Check common secret patterns
          GREP_RESULT=$(grep -rE "(password|secret|api_key|token|credential)" . \
            --include="*.py" --include="*.js" --include="*.json" --exclude-dir=".git" \
            2>/dev/null | head -20 || echo "No obvious secrets found")
          
          if [ -z "$GREP_RESULT" ]; then
            echo "✅ No obvious secrets detected"
          else
            echo "⚠️ Potential secrets found:"
            echo "$GREP_RESULT"
            exit 1
          fi
      
      - name: Verify gitignore includes sensitive files
        run: |
          if grep -q "id_rsa\|.env\|\.pem" .gitignore; then
            echo "✅ .gitignore configured properly"
          else
            echo "⚠️ Warning: .gitignore may be missing sensitive file patterns"
            exit 1
          fi

  final-report:
    name: "Final Report"
    needs: [audit-dependencies, check-secrets]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Summary
        run: |
          echo "=========================================="
          echo "🔒 SUPPLY CHAIN AUDIT COMPLETE"
          echo "=========================================="
          echo "Date: $(date)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          
          if needs.audit-dependencies.result == 'success' && needs.check-secrets.result == 'success'; then
            echo ""
            echo "✅ ALL CHECKS PASSED!"
            echo "✅ No vulnerabilities found"
            echo "✅ No secrets leaked"
            echo "=========================================="
          else
            echo ""
            echo "❌ AUDIT FAILED"
            echo "Details available in artifacts"
            echo "=========================================="
            exit 1
          fi
