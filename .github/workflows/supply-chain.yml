name: 🔒 Supply Chain Audit - FINAL FIX

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Simple Secret Detection
        run: |
          echo "🔍 Scanning for secrets..."

          # Check common patterns in backend source files
          RESULT=$(grep -rn -E "(password|secret|api_key|token)" backend/src --include="*.py" 2>/dev/null | grep -v "^#" | grep -v "\.pyc" | grep -v "__pycache__" | head -5 || true)

          if [ -n "$RESULT" ]; then
            echo "⚠️ Potential hardcoded credentials found:"
            echo "$RESULT"
            exit 1
          fi

          echo "✅ No obvious secrets detected"
      
      - name: Verify .gitignore
        run: |
          echo "📄 Checking security config..."
          test -f .gitignore && grep -q "id_rsa" .gitignore && echo "✅ Secure!" || exit 1
      
      - name: Success Report
        run: |
          echo ""
          echo "=========================================="
          echo "✅ SUPPLY CHAIN AUDIT COMPLETE"
          echo "=========================================="
          echo "✓ Code scan passed"
          echo "✓ Configuration verified"
          echo "✓ Ready for deployment!"
          echo "=========================================="
