name: Deploy

# CI/CD deploy ke VPS via scripts/deploy/deploy-stack.sh (sumber tunggal).
# Secrets per environment disimpan di GitHub Actions secrets.
#
# Yang dibutuhkan (Settings → Secrets and variables → Actions):
#   STAGING:  STAGING_HOST, STAGING_USER, STAGING_SSH_KEY (private key),
#             STAGING_DB_PASSWORD, STAGING_HMAC_SECRET_KEY,
#             STAGING_LLM_GATEWAY_API_KEY, STAGING_VNC_PASSWORD
#   PROD    : PROD_HOST, PROD_USER, PROD_SSH_KEY,
#             PROD_DB_PASSWORD, PROD_HMAC_SECRET_KEY,
#             PROD_LLM_GATEWAY_API_KEY, PROD_VNC_PASSWORD
#
# SSH key: generate `ssh-keygen -t ed25519 -f lumine_deploy` lalu tambahkan
# public key ke ~/.ssh/authorized_keys user target di VPS. Private key → secret
# *_SSH_KEY (format PEM: `-----BEGIN OPENSSH PRIVATE KEY-----` ...).
#
# Catatan: deploy-stack.sh SSH dari runner GitHub ke VPS. Runner butuh akses
# SSH keluar (port 22) — default ubuntu-latest runner mengizinkan.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: "Deploy to staging"
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust host on first connect (non-interactive).
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Make deploy script executable
        run: chmod +x scripts/deploy/deploy-stack.sh

      - name: Deploy to staging VPS
        env:
          VPS_HOST: ${{ secrets.STAGING_HOST }}
          VPS_USER: ${{ secrets.STAGING_USER }}
          VPS_SSH_PORT: "22"
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          HMAC_SECRET_KEY: ${{ secrets.STAGING_HMAC_SECRET_KEY }}
          LLM_GATEWAY_API_KEY: ${{ secrets.STAGING_LLM_GATEWAY_API_KEY }}
          VNC_PASSWORD: ${{ secrets.STAGING_VNC_PASSWORD }}
          # deploy-stack.sh pakai SSH key default ~/.ssh/id_*. Runner tidak
          # punya, jadi arahkan ke deploy_key via SSH identity.
          SSH_AUTH_SOCK: ""
        run: |
          # Paksa pakai deploy_key untuk semua SSH/scp di script.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          # deploy-stack.sh pakai ssh/scp biasa — override via ssh config.
          cat > ~/.ssh/config <<SSHCFG
          Host ${{ secrets.STAGING_HOST }}
            HostName ${{ secrets.STAGING_HOST }}
            User ${{ secrets.STAGING_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          SSHCFG
          chmod 600 ~/.ssh/config
          ./scripts/deploy/deploy-stack.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-production:
    name: "Deploy to production"
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Make deploy script executable
        run: chmod +x scripts/deploy/deploy-stack.sh

      - name: Deploy to production VPS
        env:
          VPS_HOST: ${{ secrets.PROD_HOST }}
          VPS_USER: ${{ secrets.PROD_USER }}
          VPS_SSH_PORT: "22"
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          HMAC_SECRET_KEY: ${{ secrets.PROD_HMAC_SECRET_KEY }}
          LLM_GATEWAY_API_KEY: ${{ secrets.PROD_LLM_GATEWAY_API_KEY }}
          VNC_PASSWORD: ${{ secrets.PROD_VNC_PASSWORD }}
        run: |
          cat > ~/.ssh/config <<SSHCFG
          Host ${{ secrets.PROD_HOST }}
            HostName ${{ secrets.PROD_HOST }}
            User ${{ secrets.PROD_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          SSHCFG
          chmod 600 ~/.ssh/config
          ./scripts/deploy/deploy-stack.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
