name: Deploy

# Deploy ke VPS — dijalankan manual via workflow_dispatch atau otomatis
# saat push ke main JIKA secrets sudah dikonfigurasi.
#
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key),
#   DEPLOY_DB_PASSWORD, DEPLOY_HMAC_SECRET_KEY,
#   DEPLOY_LLM_GATEWAY_API_KEY, DEPLOY_VNC_PASSWORD
#
# SSH key: generate `ssh-keygen -t ed25519 -f lumine_deploy` lalu tambahkan
# public key ke ~/.ssh/authorized_keys user target di VPS. Private key → secret
# DEPLOY_SSH_KEY (format PEM: `-----BEGIN OPENSSH PRIVATE KEY-----` ...).
#
# Saat ini hanya landing page yang di-deploy via deploy-site.sh.
# Full stack deploy menyusul saat V1 services siap (Phase 15).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secrets:
    name: "Check secrets"
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Secrets ditemukan — deploy akan dijalankan."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets belum dikonfigurasi — deploy dilewati."
            echo "::notice::Konfigurasi di: Settings → Secrets and variables → Actions → New repository secret"
          fi

  deploy:
    name: "Deploy to VPS"
    needs: [check-secrets]
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Make deploy scripts executable
        run: chmod +x scripts/deploy/deploy-site.sh

      - name: Deploy landing page
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_USER }}
          VPS_SSH_PORT: "22"
        run: |
          cat > ~/.ssh/config <<SSHCFG
          Host ${{ secrets.DEPLOY_HOST }}
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          SSHCFG
          chmod 600 ~/.ssh/config
          ./scripts/deploy/deploy-site.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key