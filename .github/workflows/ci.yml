name: CI — Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.x"

jobs:
  # Stage 1: Static analysis (parallel) ──────────────────────────────────────

  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  type-check:
    name: "Type check (mypy)"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run mypy src/

  security:
    name: "Security scans"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run bandit -r src/ -ll
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/default
      - uses: gitleaks/gitleaks-action@v2
      - run: uv run pip-audit

  # ── Stage 2: Tests (parallel) ────────────────────────────────────────────────

  unit-tests:
    name: "Unit tests"
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumine
          POSTGRES_PASSWORD: lumine
          POSTGRES_DB: lumine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit/ -v --tb=short --suppress-no-test-exit-code
        env:
          DATABASE_URL: postgresql+asyncpg://lumine:lumine@localhost:5432/lumine_test
          REDIS_URL: redis://localhost:6379/0

  integration-tests:
    name: "Integration tests"
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumine
          POSTGRES_PASSWORD: lumine
          POSTGRES_DB: lumine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://lumine:lumine@localhost:5432/lumine_test
          REDIS_URL: redis://localhost:6379/0

  contract-tests:
    name: "Contract tests"
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/contract/ -v --tb=short

  # ── Stage 3: System tests ────────────────────────────────────────────────────

  system-tests:
    name: "System tests"
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumine
          POSTGRES_PASSWORD: lumine
          POSTGRES_DB: lumine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/system/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://lumine:lumine@localhost:5432/lumine_test
          REDIS_URL: redis://localhost:6379/0

  # ── Stage 4: Container scan ──────────────────────────────────────────────────

  container-scan:
    name: "Container scan (Trivy)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumine:${{ github.sha }} backend/
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: lumine:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
