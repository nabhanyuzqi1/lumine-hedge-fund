name: Docs Integrity

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'infrastructure/**'
      - '.github/workflows/docs.yml'
      - 'docs/_ci/**'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'infrastructure/**'
      - '.github/workflows/docs.yml'
      - 'docs/_ci/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
      - name: Link check
        run: lychee --no-progress --exclude-loopback 'docs/**/*.md' '*.md' 'infrastructure/**/*.md'
      - name: ADR index check
        run: python3 docs/_ci/adr-index-check.py
      - name: Doc freshness check
        run: python3 docs/_ci/doc-freshness-check.py || true  # warn-only for now
