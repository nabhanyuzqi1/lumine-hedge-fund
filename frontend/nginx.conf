# Lumine frontend — SPA static serving (nginx).
# API calls are proxied by the compose Caddy (see backend/Caddyfile), so
# this server only needs to serve the built assets with SPA fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
