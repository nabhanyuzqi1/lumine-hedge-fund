# Lumine frontend — SPA static serving (nginx).
# API calls are proxied by the compose Caddy (see backend/Caddyfile), so
# this server only needs to serve the built assets with SPA fallback.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: nested routes (/app/*, /admin/*) di-refresh langsung.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset ber-hash: cache immutable (tidak pernah berubah per hash).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html TIDAK boleh di-cache: setelah rebuild, HTML lama yang
    # mengacu asset hash lama → MIME text/html → blank screen di refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
