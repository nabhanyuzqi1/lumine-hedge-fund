<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0B0F17"/>
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#4D8DFF" stroke-width="1.6" stroke-dasharray="62 23" stroke-linecap="round" opacity="0.45"/>
  <!-- Core halo -->
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#4D8DFF" stroke-width="0.8" opacity="0.25"/>
  <!-- Core radiant (4 sinar) -->
  <g stroke="#4D8DFF" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
    <path d="M16 8.2 V5.5"/>
    <path d="M16 23.8 V26.5"/>
    <path d="M8.2 16 H5.5"/>
    <path d="M23.8 16 H26.5"/>
  </g>
  <!-- Core -->
  <circle cx="16" cy="16" r="3.4" fill="#4D8DFF"/>
  <!-- Ascending signal -->
  <path d="M4.5 23.5 L10 18 L14 21 L19.5 12.5 L24 9" fill="none" stroke="#4D8DFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal head -->
  <circle cx="24" cy="9" r="2.6" fill="#34D399"/>
</svg>
