# Lumine landing page — containerized nginx (replaces host nginx, 2026-08-08)
# Port internal 80; dipetakan ke 127.0.0.1:8080 via compose (loopback-only,
# akses publik hanya lewat Caddy). Replika /etc/nginx/sites-enabled/lumine.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
