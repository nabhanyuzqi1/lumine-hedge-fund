# Control Plane Services for Lumine Hedge Fund Platform
# All services accessible via Caddy reverse proxy with Authelia authentication
# Deploy: docker compose -f infrastructure/control-plane/docker-compose.yml up -d

services:
  # ──────────────────────────────────────────────────────────
  # Caddy Reverse Proxy & TLS Auto-HTTPS
  # ──────────────────────────────────────────────────────────
  
  control-caddy:
    image: caddy:2-alpine
    container_name: control-caddy
    restart: unless-stopped
    network_mode: host  # Required for direct HTTPS binding
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ──────────────────────────────────────────────────────────
  # Authelia - Authentication & SSO Provider
  # ──────────────────────────────────────────────────────────
  
  control-authelia:
    image: authelia/authelia:latest
    container_name: control-authelia
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"  # Local access only
    volumes:
      - ./authelia/config.yml:/etc/authelia/config.yml:ro
      - ./authelia/secrets:/etc/authelia/secrets:rw
      - ./authelia/users.db:/var/lib/authelia/database.db:rw
    depends_on:
      control-database:
        condition: service_healthy
    networks:
      - control-network
  
  control-database:
    image: postgres:16-alpine
    container_name: authelia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: authelia
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: authelia
    volumes:
      - authelia_db_data:/var/lib/postgresql/data
      - secrets_dir:/run/secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authelia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control-network
  
  # ──────────────────────────────────────────────────────────
  # Homepage - Service Dashboard & Aggregator
  # ──────────────────────────────────────────────────────────
  
  control-homepage:
    image: gethomepage/homepage:v0.9
    container_name: control-homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./homepage/settings.yml:/app/settings.yml:ro
      - ./homepage/services.yml:/app/services.yml:ro
      - ./homepage/widgets.yml:/app/widgets.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - control-caddy
    networks:
      - control-network
      - host-network
  
  # ──────────────────────────────────────────────────────────
  # Uptime Kuma - Monitoring & Health Checks
  # ──────────────────────────────────────────────────────────
  
  control-uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: control-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - control-network
  
  # ──────────────────────────────────────────────────────────
  # Dozzle - Real-time Container Log Viewer
  # ──────────────────────────────────────────────────────────
  
  control-dozzle:
    image: amir20/dozzle:latest
    container_name: control-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-network
  
  # ──────────────────────────────────────────────────────────
  # Landing Page (Marketing Site)
  # ──────────────────────────────────────────────────────────
  
  control-landing:
    image: nginx:alpine
    container_name: control-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../../dashboard/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - control-caddy
    networks:
      - control-network

networks:
  control-network:
    driver: bridge
  host-network:
    driver: host

volumes:
  caddy_data:
  caddy_config:
  authelia_db_data:
  uptime_kuma_data:
  secrets_dir:
