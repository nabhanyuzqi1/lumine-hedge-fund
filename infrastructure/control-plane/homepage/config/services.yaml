# Homepage services — versioned copy of /srv/control-plane/homepage/services.yaml
#
# CATATAN PENTING (insiden 2026-08-11): jangan tambahkan group berisi
# `widget:` saja ("widget-only group") — parser Homepage 1.13.2 melakukan
# `group[groupName].forEach` tanpa guard, sehingga object widget memicu
# `TypeError: b[c].forEach is not a function` dan SELURUH services.yaml
# gagal di-load (portal kosong + error berantai di console browser).
# Widget `logview` juga tidak ada di Homepage 1.13.2 (docs-nya 404).

